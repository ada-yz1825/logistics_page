let scene='c2c',direction='forward',route='network',branch='normal',focus='pickup';
const $=id=>document.getElementById(id);
function returnStages(){return route==='direct'?[RETURN_NETWORK.direct,RETURN_NETWORK.dropoff]:[RETURN_NETWORK.intake,RETURN_NETWORK.sort,RETURN_NETWORK.linehaul,RETURN_NETWORK.relay,RETURN_NETWORK.destination,RETURN_NETWORK.dropoff]}
function currentStages(){
  let list=direction==='reverse'?REVERSE:FORWARD;
  if(direction==='reverse'){list=[...list.slice(0,3),...returnStages(),...list.slice(3)];if(scene==='c2c')list=list.filter(s=>s.id!=='r-inspect');return list}
  if(scene==='b2b'&&route==='direct')list=list.filter(s=>!['origin','sort','hub','relay','desthub','destsort','station'].includes(s.id));
  if(branch==='normal')return list;
  if(branch==='cancel')return [list[0],EXCEPTION_STAGES.cancelled];
  const before=id=>list.slice(0,list.findIndex(s=>s.id===id)+1);

function activate(el){
  if(el?.dataset.scene&&el.dataset.scene!==scene)transitionTo(()=>{scene=el.dataset.scene;if(scene!=='c2b'&&branch==='return'){branch='normal';direction='forward';focus='pickup'}},false);
  else if(el?.hasAttribute('data-return-toggle')&&scene==='c2b'){const next=branch==='return'?'normal':'return';transitionTo(()=>{branch=next;direction=next==='return'?'reverse':'forward';focus=next==='return'?'r-request':'pickup'},false);setTimeout(()=>centerCard(focus),100)}
  else if(el?.dataset.route&&el.dataset.route!==route)transitionTo(()=>{route=el.dataset.route},false);
  else if(el?.dataset.branch&&el.dataset.branch!==branch){
    const next=el.dataset.branch;
    transitionTo(()=>{branch=next;direction=next==='return'?'reverse':'forward';focus={normal:'pickup',return:'r-request',cancel:'cancelled',intercept:'interceptRequest',interceptFail:'interceptFailed',reroute:'replan',failed:'failedAttempt',refuse:'refusal',pickupPoint:'pickupNotice',unclaimed:'unclaimedReturn'}[next]},false);
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)$('branchContext').animate([{opacity:.2,transform:'translateY(-5px)'},{opacity:1,transform:'translateY(0)'}],{duration:300,easing:'ease-out'});
    setTimeout(()=>centerCard(focus),100);
  }
}
let edgeNudgeUntil=0;
function nudgeFromRightmost(card){
  const box=$('flowScroll'),max=box.scrollWidth-box.clientWidth;
  if(max-box.scrollLeft<5||performance.now()<edgeNudgeUntil)return;
  const vr=box.getBoundingClientRect();
  const visible=[...$('flow').querySelectorAll('.flow-card')].filter(el=>{const r=el.getBoundingClientRect();return r.right>vr.left+4&&r.left<vr.right-4});
  if(visible.at(-1)!==card)return;
  const gap=parseFloat(getComputedStyle($('flow')).getPropertyValue('--node-gap'))||30;
  const step=Math.min(card.getBoundingClientRect().width+gap,max-box.scrollLeft);
  edgeNudgeUntil=performance.now()+750;
  box.scrollTo({left:box.scrollLeft+step,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
}
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const card=e.target.closest?.('[data-node]');if(card&&!card.contains(e.relatedTarget))nudgeFromRightmost(card)});
document.addEventListener('click',e=>{activate(e.target.closest?.('[data-scene],[data-route],[data-branch],[data-return-toggle]'));const card=e.target.closest?.('[data-node]');if(card)setFocus(card.dataset.node)});
document.addEventListener('keydown',e=>{const card=e.target.closest?.('[data-node]');if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setFocus(card.dataset.node)}});
$('prevNode').addEventListener('click',()=>stepNode(-1));$('nextNode').addEventListener('click',()=>stepNode(1));
$('flowScroll').addEventListener('scroll',updateFlowNav,{passive:true});
new ResizeObserver(()=>{layoutFlow();updateFlowNav()}).observe($('flowScroll'));
let previousFocus=null;function openModal(kind){previousFocus=document.activeElement;if(kind==='refs'){$('modalTitle').textContent='参考文档';$('modalBody').innerHTML='<p>本图将 GS1 退货交接与运输、UPU 网络收寄分拣作业以及承运商异常处理规则组合成行业示意。返运路径是可能的组织方式，网点、分拣和中转不代表每票必经。不同企业、服务产品和运输网络可增减实际节点。</p>'+SOURCES.map(([name,desc,url])=>`<div class="reference"><strong><a href="${url}" target="_blank" rel="noopener noreferrer">${ESC(name)} ↗</a></strong><span>${ESC(desc)}</span></div>`).join('')}else{$('modalTitle').textContent='读图说明';$('modalBody').innerHTML='<p>左侧选择 C2C、C2B、B2C、B2B 业务场景；进入 C2B 场景后，会在其下方显示“退货单”开关；打开时展示回流链路，关闭时回到常规交付。主图上方选择常规交付或异常分支；B2B 以及返运分支还可以选择直达或网络路径。</p><p>主图按时间从左到右展示路径；绿色卡片和回转箭头提示实物回流。拦截仅为申请，执行结果取决于货物状态与服务规则。网络返运的网点、分拣和中转是可选的典型作业，不代表所有货物必经。</p><p>每张卡片内按时间顺序列出作业；点击卡片后更新下方详情。可用两侧按钮或键盘左右箭头逐节点浏览。</p><p>本图将同一地点连续作业合并：业务订单与物流委托、站点与配送交接、末端交付与签收。物流委托生成与实物揽收仍是不同节点。</p>'}$('modalLayer').classList.add('open');$('modalLayer').setAttribute('aria-hidden','false');$('closeModal').focus()}
function closeModal(){$('modalLayer').classList.remove('open');$('modalLayer').setAttribute('aria-hidden','true');previousFocus?.focus()}
$('guideBtn').onclick=()=>openModal('guide');$('refsBtn').onclick=()=>openModal('refs');$('closeModal').onclick=closeModal;$('modalLayer').addEventListener('click',e=>{if(e.target===$('modalLayer'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalLayer').classList.contains('open')){closeModal();return}if($('modalLayer').classList.contains('open')||e.target.matches('input,textarea,select,[contenteditable="true"]'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();stepNode(e.key==='ArrowRight'?1:-1)}});render();
</script>
