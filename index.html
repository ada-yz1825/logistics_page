    .surface{min-width:0;min-height:0;display:flex;flex-direction:column;gap:9px}.chart{flex:1;min-height:0;border:1px solid #accbdc;border-radius:15px;background:linear-gradient(180deg,#fbfdff,#f0f8fb);overflow-x:auto;overflow-y:hidden;scrollbar-color:#78aeca #dbeaf3;scrollbar-width:thin;box-shadow:0 5px 18px #14436513}.chart-inner{height:100%;min-height:375px;padding:12px;display:flex;flex-direction:column}.chart-heading{flex:none;min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#416c84}.chart-heading strong{font-size:15px;color:#0b6079}.chart-heading small{font-size:12px;font-weight:700;white-space:nowrap}.flow{display:flex;align-items:stretch;gap:12px;flex:1;min-height:0}.flow-card{position:relative;flex:0 0 205px;min-width:205px;background:#fff;border:1px solid #b5cedd;border-radius:12px;box-shadow:0 5px 13px #164a6720;display:flex;flex-direction:column;overflow:visible;transition:border-color .25s,box-shadow .25s,background .25s}.flow-card:not(:last-child)::after{content:"";position:absolute;left:calc(100% + 2px);top:52%;width:9px;height:9px;border-top:3px solid #2c92a5;border-right:3px solid #2c92a5;transform:rotate(45deg);z-index:2}.flow-card.active{border-color:#18a4a4;box-shadow:0 0 0 2px #60d9d059,0 8px 17px #187b8c27}.flow-card.reverse.active{border-color:#2d9b78;box-shadow:0 0 0 2px #62ca9a59,0 8px 17px #22775025}.card-head{min-height:88px;border-radius:11px 11px 0 0;background:#e4f1f7;padding:11px;display:flex;gap:9px;align-items:flex-start}.flow-card.active .card-head{background:#dbf5f1}.flow-card.reverse .card-head{background:#e6f5eb}.card-head img{width:47px;height:47px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 2px #0b476120)}.card-title{min-width:0}.card-title h3{font-size:14px;line-height:1.25;margin:2px 0 4px}.card-title p{margin:0;font-size:11px;color:#55758a;line-height:1.3}.card-number{font-size:11px;color:#7995a5;padding:8px 10px 1px}.mini-flow{list-style:none;padding:7px 9px;margin:0;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:space-evenly;gap:5px}.mini-flow li{position:relative;display:flex;align-items:center;gap:6px;min-height:27px;font-size:11px;color:#315a70}.mini-flow li:not(:last-child)::before{content:"";position:absolute;left:9px;top:calc(50% + 10px);height:calc(100% - 8px);border-left:1px solid #9bd0d1}.mini-flow .num{width:20px;height:20px;border-radius:50%;background:#e0f4f2;border:1px solid #8dcac8;color:#087c86;display:grid;place-items:center;flex:none;font-size:10px;font-weight:900}.mini-flow .step{padding:5px 6px;background:#f4f9fb;border:1px solid #e1edf2;border-radius:6px;flex:1;min-width:0}.card-note{margin:2px 9px 10px;background:#f3f9fb;border-left:2px solid #8fcbd2;color:#54778b;padding:7px 8px;font-size:11px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:45px}.flow-card.reverse .card-note{background:#f2f9f4;border-color:#97cba7}.card-foot{border-top:1px solid #edf3f7;color:#7893a3;padding:6px 10px;font-size:10px;border-radius:0 0 11px 11px}.detail{height:143px;flex:none;background:#fff;border:1px solid var(--line);border-radius:13px;display:grid;grid-template-columns:170px 1fr;overflow:hidden;box-shadow:0 3px 12px #194b6510}.detail-title{background:var(--navy);color:#fff;padding:15px 13px;display:flex;flex-direction:column;justify-content:center}.detail-title small{font-size:11px;color:#71dfd3;font-weight:800}.detail-title strong{font-size:17px;line-height:1.22;margin:5px 0}.detail-title em{font-style:normal;color:#bbd3df;font-size:11px}.detail-body{padding:14px 17px;overflow:auto;color:#47677b;font-size:12px}.detail-body p{margin:0 0 8px}.detail-body b{color:#167e8d}.detail-body .sequence{color:#1e5e75;font-weight:700}.sourcebar{height:29px;flex:none;background:#d9ebf4;border-top:1px solid #b9d4e3;color:#466c83;padding:0 13px;display:flex;align-items:center;gap:8px;font-size:11px}.sourcebar a{color:#17668b;text-decoration:none;font-weight:800}.sourcebar button{margin-left:auto;border:0;background:transparent;color:#116e80;font-weight:900}.sourcebar a:hover,.sourcebar button:hover{text-decoration:underline}

    @keyframes reveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:950px){.brand p{display:none}.main{grid-template-columns:190px minmax(0,1fr)}.flow-card{flex-basis:190px;min-width:190px}}@media(max-width:680px){.app{min-height:0}.topbar{height:53px;padding:0 9px}.brand h1{font-size:15px}.brand-logo{width:25px;height:25px;font-size:14px}.top-actions button{font-size:11px;padding:5px 7px}.main{padding:6px;grid-template-columns:117px minmax(0,1fr);gap:5px}.sidebar{padding:6px;gap:7px}.rail-heading{font-size:10px}.switch-card{padding:4px}.switch-label{display:none}.direction-switch button{font-size:10px;padding:6px 2px}.switch-hint,.rail-note{display:none}.scene-group{padding:3px;gap:3px}.scene{padding:4px}.scene strong{font-size:10px}.scene .scene-desc{font-size:9px}.route-block{padding:4px}.route{font-size:10px;padding:4px}.chart-inner{padding:7px;min-height:320px}.chart-heading strong{font-size:12px}.chart-heading small{font-size:10px}.flow-card{flex-basis:172px;min-width:172px}.card-head{min-height:77px;padding:7px}.card-head img{width:37px;height:37px}.card-title h3{font-size:12px}.detail{height:125px;grid-template-columns:99px 1fr}.detail-title{padding:7px}.detail-title strong{font-size:13px}.detail-body{padding:8px;font-size:10px}.sourcebar{height:24px;font-size:10px;padding:0 6px}.sourcebar a:nth-of-type(n+3){display:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

<body>
<div class="app">
  <header class="topbar"><div class="brand"><span class="brand-logo" aria-hidden="true">◇</span><h1>物流行业全链路流程图</h1><p>订单、实物、运输、交付与回流</p></div><div class="top-actions"><button type="button" id="guideBtn">读图说明</button><button type="button" id="refsBtn">参考资料</button></div></header>
  <main class="main">
    <aside class="sidebar" aria-label="业务场景与方向">
      <div class="rail-heading">流程方向</div>
      <div class="switch-card"><p class="switch-label">选择当前展示的链路</p><div class="direction-switch" id="directionSwitch"><span class="switch-slider" aria-hidden="true"></span><button type="button" data-direction="forward" aria-pressed="true">正向履约</button><button type="button" data-direction="reverse" aria-pressed="false">逆向订单</button></div><p class="switch-hint" id="switchHint">从业务发起到签收、结算</p></div>
      <div class="rail-heading">业务场景</div>
      <div class="scene-group"><div class="group-title">个人发起</div><button type="button" class="scene active" data-scene="c2c" aria-pressed="true"><strong>C2C　个人 → 个人</strong><span class="scene-desc">个人寄件，上门揽收或自行交件，交付另一位个人。</span></button><button type="button" class="scene" data-scene="c2b" aria-pressed="false"><strong>C2B　个人 → 企业</strong><span class="scene-desc">退货、返修、回收、送检等，企业接收并验收。</span></button></div>
      <div class="scene-group"><div class="group-title">企业发起</div><button type="button" class="scene" data-scene="b2c" aria-pressed="false"><strong>B2C　企业 → 个人</strong><span class="scene-desc">商家或仓库备货，通过仓配或承运商送到消费者。</span></button><button type="button" class="scene" data-scene="b2b" aria-pressed="false"><strong>B2B　企业 → 企业</strong><span class="scene-desc">采购、调拨与销售发货，可走整车直达或零担网络。</span></button></div>
      <div class="route-block" id="routeBlock"><span>B2B 运输路径</span><button type="button" class="route active" data-route="direct" aria-pressed="true">整车直达</button><button type="button" class="route" data-route="network" aria-pressed="false">零担网络</button></div>
      <div class="rail-note">同一地点、连续完成的作业合并展示。不同场景不经过的节点会从主图移除。</div>
    </aside>
    <div class="surface"><section class="chart" id="chart" aria-label="物流全链路流程图"><div class="chart-inner"><div class="chart-heading"><strong id="flowTitle"></strong><small id="flowCount"></small></div><div class="flow" id="flow"></div></div></section><section class="detail" id="detail" aria-live="polite"></section></div>
  </main>
  <footer class="sourcebar"><span>参考：</span><a href="https://ref.gs1.org/standards/logistics-interoperability/1.1.1/" target="_blank" rel="noopener noreferrer">GS1 LIM</a><span>·</span><a href="https://scor.ascm.org/" target="_blank" rel="noopener noreferrer">ASCM SCOR</a><span>·</span><a href="https://cscmp.org/CSCMP/Educate/SCM_Definitions_and_Glossary_of_Terms.aspx" target="_blank" rel="noopener noreferrer">CSCMP</a><button type="button" id="refsFoot">全部参考文档 ↗</button></footer>
</div>
<div class="modal-layer" id="modalLayer" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button type="button" id="closeModal">关闭 ×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<script>
const SOURCES=[
  ['GS1 · Logistics Interoperability Model','物流服务购买方、服务提供方，以及计划、接货、运输、交付和结算等协同关系。','https://ref.gs1.org/standards/logistics-interoperability/1.1.1/'],
  ['ASCM · SCOR Digital Standard','计划、订单、履约与退回的端到端流程框架。','https://scor.ascm.org/'],
  ['CSCMP · Supply Chain Management Definitions','物流管理涵盖运输、仓储、订单履约、网络设计、库存等活动。','https://cscmp.org/CSCMP/Educate/SCM_Definitions_and_Glossary_of_Terms.aspx'],
  ['国家标准全文公开系统','物流术语与相关作业标准，可核对中文行业用语。','https://openstd.samr.gov.cn/']
];
const SCENES={c2c:'C2C 个人 → 个人',c2b:'C2B 个人 → 企业',b2c:'B2C 企业 → 个人',b2b:'B2B 企业 → 企业'};
const FORWARD=[
 {id:'order',title:'业务订单与物流委托',icon:'order',caption:'线上／线下发起服务',steps:['明确发运需求','提交物流委托','确认服务与运单'],detail:'交易、寄件或调拨先形成发运需求；服务购买方向平台、物流企业或货代下单。业务订单、物流委托和实际揽收是不同状态。',by:{c2c:['填写寄收地址与物品','选寄递产品与取件方式','报价／保价并提交寄件单','平台受理并生成运单'],c2b:['提交退货／返修／回收申请','获得回寄码或取件单','指定企业收货点与承运方','生成回寄运单'],b2c:['交易订单与支付校验','商家／平台接单','选择仓配或快递服务','拆单／合单并生成运单'],b2b:['采购／销售／调拨计划','核对货量、交期与地点','询价／合同发运','订车／订舱并确认时窗']}},
 {id:'prepare',title:'备货与包装',icon:'parcel',caption:'发货方内部作业',steps:['备货与核对','包装／装载单元','标签与单证'],detail:'在发货方场所完成准备。个人包装、商家拣货、企业托盘化的作业不同，但都发生在承运商接货之前。',by:{c2c:['整理并包装物品','核对禁限寄要求','准备交件'],c2b:['按回寄要求包装','备齐凭证与配件','等待取件'],b2c:['库存分配与拣货','复核、包装、贴标','出库暂存'],b2b:['工厂／仓库备货','托盘化与装箱','装箱单、批次与集货']}},
 {id:'pickup',title:'揽收与交接',icon:'handover',caption:'实物进入物流网络',steps:['上门揽收／交件','清点计量与核验','交接扫描'],detail:'物流方在寄件处、仓库月台或网点实际接到货物。接单、仓库出库与承运商接货应分别记录。',by:{c2c:['快递员上门／到店','实名与收寄验视','称重量方','揽收扫描'],c2b:['上门取回／网点交件','核对回寄任务','称重与揽收','回收交接'],b2c:['仓库／商家出库交接','承运商清点揽收','扫描与差异反馈'],b2b:['车辆到厂／仓','月台装货','件数／封签核对','签交接单']}},
 {id:'origin',title:'始发网点',icon:'station',caption:'接收与区域集货',steps:['到件扫描','区域集货','发往始发分拨'],detail:'快递或零担网络常见的始发接入点。工厂整车直送一般跳过。'},
 {id:'sort',title:'始发分拣中心',icon:'sort',caption:'按目的地形成批次',steps:['卸车与到件扫描','安检／计量','解包与分拣','路由归集','建包装车'],detail:'在同一分拣中心将零散货物按目的地或下一程线路归集；异常件在此登记。'},
 {id:'hub',title:'始发枢纽',icon:'hub',caption:'跨线路组织',steps:['到车交接','卸车与跨线分流','集货与配载','装车发出'],detail:'跨线路转运、越库和集货在始发枢纽完成；一些线路可从分拣中心直接进入干线。'},
 {id:'linehaul',title:'干线发运与在途',icon:'truck',caption:'公路／铁路／航空／水运',steps:['形成运输需求','匹配运力与班次','调度与配载','装车／装舱','实际发车并跟踪'],detail:'实际发车是运输执行开始的明确状态。装车完成不等于发车；在途应跟踪位置、时效和异常。'},
 {id:'relay',title:'中转枢纽',icon:'transfer',caption:'可选 0–N 次',steps:['到达扫描','卸货／换装','下程路由分流','再集货与配载','二次发运'],detail:'依网络布局和运输方式，可能没有中转，也可能多次中转；直达运输通常跳过。'},
 {id:'desthub',title:'目的地枢纽',icon:'hub',caption:'接入区域网络',steps:['干线到达交接','到件扫描','区域分流','发往目的地分拨'],detail:'目的地枢纽把跨区货物导入区域配送网络；直送收货方的整车可跳过。'},
 {id:'destsort',title:'目的地分拨',icon:'sort',caption:'按末端站点归集',steps:['到车卸货','扫描与分拣','路由归集','建包／装车','发往站点'],detail:'在同一分拨中心把货物分配到目的地站点、营业部或支线车辆。'},
 {id:'station',title:'到站与配送交接',icon:'station',caption:'站点连续作业',steps:['站点接货与扫描','落地分件／暂存','分配配送员或车辆','装车并规划路线'],detail:'到站、分件、暂存和配送员接货发生在同一站点，合并为一张卡片；到站不等于签收。'},
 {id:'delivery',title:'末端交付与签收',icon:'delivery',caption:'收货地点连续作业',steps:['送达或约定自提','核对收货对象','签收／验收','异常与结果回传'],detail:'在收货地点完成交付与签收；企业入库验收可能晚于承运商交付，应保留独立记录。',by:{c2c:['上门派送／自提','收件人或代收人签收','拒收／未妥投处理','结果回传'],c2b:['送达企业／回收点','企业签收','检测或分类任务创建','异常反馈'],b2c:['上门派送／驿站自提','消费者签收','售后时效开始','拒收／未妥投处理'],b2b:['预约到货与卸货','收货方清点签单','数量／质量验收','回单与差异记录']}},
 {id:'close',title:'结算与售后闭环',icon:'settlement',caption:'订单数据与费用闭环',steps:['计费对账','结算／开票','投诉与理赔','状态归档'],detail:'费用结算、售后和异常处理可与实物流动部分并行。退货、返修、回收可再触发新的逆向链路。'}
];
const REVERSE=[
 {id:'r-request',title:'逆向申请与受理',icon:'reverse',caption:'形成回流服务需求',steps:['提交原因和货物信息','审核规则与凭证','明确承担方和费用','生成逆向订单'],detail:'拒收、退货、返修、召回、回收等触发新的物流委托；原交易售后单与逆向运单应关联。',by:{c2c:['发起拒收／退回','确认原寄件人','确定退回费用','生成退回任务'],c2b:['提交返修／回收申请','企业审核与受理','确认回寄条件','生成逆向订单'],b2c:['消费者申请退货','商家／平台审核','确定退款与运费规则','生成退货单'],b2b:['企业退货／召回','核对合同与批次','明确责任与费用','生成返运委托']}},
 {id:'r-book',title:'回寄预约',icon:'calendar',caption:'确定取件方式与时间',steps:['确定取件地址','选择上门／自行交件','预约时间窗口','准备包装与标签'],detail:'取件预约与物流委托通常在线上完成；实物尚未进入逆向运输网络。'},
 {id:'r-pick',title:'逆向揽收',icon:'handover',caption:'退回货物交接',steps:['交件核验','称重／计量与扫描','记录货物状态','责任交接'],detail:'承运方实际取得退回货物，建立原订单、逆向运单与交接记录的对应关系。'},
 {id:'r-transit',title:'逆向运输',icon:'truck',caption:'回流到处理地点',steps:['路由与配载','始发集货／中转','在途运输','异常跟踪'],detail:'可走正向网络的反向线路，也可使用专门的回收、维修或召回路线。'},
 {id:'r-receive',title:'回流接收',icon:'warehouse',caption:'退回目的地',steps:['到货签收','核对数量与状态','入库或登记差异'],detail:'目的地可以是原寄件人、商家仓、维修中心、检测点或回收仓。',by:{c2c:['原寄件人接收','核对退回货物','签收或反馈异常'],c2b:['企业／回收点接收','核对回寄任务','登记差异'],b2c:['商家仓接收','核对退货单','退货入库'],b2b:['企业仓接收','批次与数量核对','差异登记']}},
 {id:'r-inspect',title:'检测与分类',icon:'inspect',caption:'确定货物后续去向',steps:['外观／功能检测','记录成色和损伤','分级分类','确定处置方案'],detail:'检测结果决定维修、换货、复售、再利用、再生或报废；个人退回原寄件人的货物可略过企业检测。'},
 {id:'r-close',title:'处置与结算',icon:'recycle',caption:'实物、资金和状态闭环',steps:['退款／换货／返还','复售／再生／报废','费用对账','状态归档'],detail:'实物处置、财务结算和售后状态回传完成后，逆向订单闭环。',by:{c2c:['原寄件人确认收货','退回费用结算','关闭退回任务'],c2b:['维修／回收／检测','返还或补偿','结算与归档'],b2c:['退款／换货','复售／维修／报废','对账与归档'],b2b:['换货／索赔／返修','库存与合同调整','对账与归档']}}
];
const ESC=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scene='c2c',direction='forward',route='direct',focus='pickup';
const $=id=>document.getElementById(id);
function currentStages(){let list=direction==='reverse'?REVERSE:FORWARD;if(direction==='forward'&&scene==='b2b'&&route==='direct')list=list.filter(s=>!['origin','sort','hub','relay','desthub','destsort','station'].includes(s.id));if(direction==='reverse'&&scene==='c2c')list=list.filter(s=>s.id!=='r-inspect');return list}
function steps(s){return s.by?.[scene]||s.steps}
function updateControls(){document.querySelectorAll('[data-scene]').forEach(el=>{const active=el.dataset.scene===scene;el.classList.toggle('active',active);el.setAttribute('aria-pressed',active)});document.querySelectorAll('[data-direction]').forEach(el=>el.setAttribute('aria-pressed',el.dataset.direction===direction));$('directionSwitch').classList.toggle('reverse',direction==='reverse');$('switchHint').textContent=direction==='reverse'?'退货、拒收、返修或回收的回流链路':'从业务发起到签收、结算';$('routeBlock').classList.toggle('visible',scene==='b2b'&&direction==='forward');document.querySelectorAll('[data-route]').forEach(el=>{const active=el.dataset.route===route;el.classList.toggle('active',active);el.setAttribute('aria-pressed',active)})}
function renderFlow(){const list=currentStages();if(!list.some(s=>s.id===focus))focus=list[0]?.id||'';$('flowTitle').textContent=(direction==='reverse'?'逆向订单 · ':'正向履约 · ')+SCENES[scene]+(scene==='b2b'&&direction==='forward'?' · '+(route==='direct'?'整车直达':'零担网络'):'');$('flowCount').textContent=`${list.length} 个节点 · 从左向右`;$('flow').innerHTML=list.map((s,i)=>`<article class="flow-card ${focus===s.id?'active':''} ${direction==='reverse'?'reverse':''}" data-node="${s.id}" tabindex="0" aria-label="${ESC(s.title)}"><div class="card-head"><img src="assets/icons/${s.icon}.png" width="47" height="47" alt=""><div class="card-title"><h3>${ESC(s.title)}</h3><p>${ESC(s.caption)}</p></div></div><div class="card-number">${String(i+1).padStart(2,'0')} / ${String(list.length).padStart(2,'0')}</div><ol class="mini-flow">${steps(s).map((v,j)=>`<li><span class="num">${j+1}</span><span class="step">${ESC(v)}</span></li>`).join('')}</ol><p class="card-note">${ESC(s.detail)}</p><div class="card-foot">移入查看作业说明</div></article>`).join('')}
function renderDetail(){const s=currentStages().find(x=>x.id===focus)||currentStages()[0];if(!s)return;$('detail').innerHTML=`<div class="detail-title"><small>${direction==='reverse'?'逆向订单':'正向履约'} · ${ESC(SCENES[scene])}</small><strong>${ESC(s.title)}</strong><em>${ESC(s.caption)}</em></div><div class="detail-body"><p><b>作业顺序：</b><span class="sequence">${steps(s).map(ESC).join(' → ')}</span></p><p><b>业务边界：</b>${ESC(s.detail)}</p></div>`}
function render(){updateControls();renderFlow();renderDetail()}
function transitionTo(mutate,resetScroll=false){const box=$('chart'),oldEls=[...document.querySelectorAll('#flow .flow-card')],oldRects=new Map(oldEls.map(el=>[el.dataset.node,el.getBoundingClientRect()])),viewport=box.getBoundingClientRect(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,ghosts=[];if(!reduced)oldEls.forEach(el=>{const r=el.getBoundingClientRect();if(r.right<viewport.left||r.left>viewport.right)return;const ghost=el.cloneNode(true);Object.assign(ghost.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',margin:'0',pointerEvents:'none',zIndex:'30'});document.body.appendChild(ghost);ghosts.push([el.dataset.node,ghost])});mutate();render();if(resetScroll)box.scrollLeft=0;if(reduced)return;const newIds=new Set([...document.querySelectorAll('#flow .flow-card')].map(el=>el.dataset.node));document.querySelectorAll('#flow .flow-card').forEach(el=>{const now=el.getBoundingClientRect(),before=oldRects.get(el.dataset.node);el.animate([{transform:`translate(${before?before.left-now.left:-34}px,${before?before.top-now.top:0}px)`,opacity:before?1:0},{transform:'translate(0,0)',opacity:1}],{duration:540,easing:'cubic-bezier(.2,.75,.2,1)'})});ghosts.forEach(([id,el])=>{if(newIds.has(id)){el.remove();return}const a=el.animate([{opacity:.9,transform:'scale(1)'},{opacity:0,transform:'scale(.82) translateX(-24px)'}],{duration:360,easing:'ease-out'});a.onfinish=()=>el.remove();setTimeout(()=>el.remove(),500)})}
function setFocus(id){if(focus===id)return;focus=id;document.querySelectorAll('#flow .flow-card').forEach(el=>el.classList.toggle('active',el.dataset.node===id));renderDetail()}
function activate(el){if(el?.dataset.scene&&el.dataset.scene!==scene)transitionTo(()=>{scene=el.dataset.scene},false);else if(el?.dataset.direction&&el.dataset.direction!==direction)transitionTo(()=>{direction=el.dataset.direction;focus=direction==='reverse'?'r-request':'pickup'},true);else if(el?.dataset.route&&el.dataset.route!==route)transitionTo(()=>{route=el.dataset.route},false)}
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const control=e.target.closest?.('[data-scene],[data-route]');if(control&&!control.contains(e.relatedTarget))activate(control);const card=e.target.closest?.('[data-node]');if(card&&!card.contains(e.relatedTarget))setFocus(card.dataset.node)});
document.addEventListener('click',e=>{activate(e.target.closest?.('[data-scene],[data-route],[data-direction]'));const card=e.target.closest?.('[data-node]');if(card)setFocus(card.dataset.node)});
document.addEventListener('focusin',e=>{const card=e.target.closest?.('[data-node]');if(card)setFocus(card.dataset.node)});
let previousFocus=null;function openModal(kind){previousFocus=document.activeElement;if(kind==='refs'){$('modalTitle').textContent='参考文档';$('modalBody').innerHTML='<p>本图综合行业流程资料形成通用模型。不同企业、服务产品和运输网络可增减实际节点。</p>'+SOURCES.map(([name,desc,url])=>`<div class="reference"><strong><a href="${url}" target="_blank" rel="noopener noreferrer">${ESC(name)} ↗</a></strong><span>${ESC(desc)}</span></div>`).join('')}else{$('modalTitle').textContent='读图说明';$('modalBody').innerHTML='<p>左侧先选正向或逆向，再选 C2C、C2B、B2C、B2B 场景。B2B 正向可在整车直达和零担网络间切换。</p><p>主图从左到右展示该路径实际经过的环节；不经过的节点直接移除。每张卡片内按时间顺序列出作业，卡片之间代表地点或责任方的变化。</p><p>本图将同一地点连续作业合并：业务订单与物流委托、站点与配送交接、末端交付与签收。物流委托生成与实物揽收仍是不同节点。</p>'}$('modalLayer').classList.add('open');$('modalLayer').setAttribute('aria-hidden','false');$('closeModal').focus()}
function closeModal(){$('modalLayer').classList.remove('open');$('modalLayer').setAttribute('aria-hidden','true');previousFocus?.focus()}
$('guideBtn').onclick=()=>openModal('guide');$('refsBtn').onclick=$('refsFoot').onclick=()=>openModal('refs');$('closeModal').onclick=closeModal;$('modalLayer').addEventListener('click',e=>{if(e.target===$('modalLayer'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalLayer').classList.contains('open'))closeModal()});render();
</script>
</body>
