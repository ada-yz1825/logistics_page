<div class="app">
  <header class="topbar"><div class="brand"><img class="brand-logo" src="assets/brand-logo.png" width="48" height="48" alt=""><h1>物流行业全链路流程图</h1><p>订单、实物、运输、交付与回流</p></div><div class="top-actions"><button type="button" id="guideBtn">读图说明</button><button type="button" id="refsBtn">参考资料</button></div></header>

      <div class="scene-group" id="enterpriseGroup"><div class="group-title">企业发起</div><button type="button" class="scene" data-scene="b2c" aria-pressed="false"><img class="scene-icon" src="assets/scenes/b2c.png" width="72" height="72" decoding="async" alt=""><span class="scene-copy"><strong><span class="scene-code">B2C</span><span class="scene-relation">企业 → 个人</span></strong><span class="scene-desc">例如：商家把订单商品寄给消费者。</span></span></button><button type="button" class="scene" data-scene="b2b" aria-pressed="false"><img class="scene-icon" src="assets/scenes/b2b.png" width="72" height="72" decoding="async" alt=""><span class="scene-copy"><strong><span class="scene-code">B2B</span><span class="scene-relation">企业 → 企业</span></strong><span class="scene-desc">例如：工厂向另一企业供货或调拨。</span></span></button><div class="route-block" id="routeBlock"><span id="routeTitle">运输组织</span><button type="button" class="route" data-route="direct" aria-pressed="false">直达运输</button><button type="button" class="route active" data-route="network" aria-pressed="true">网点／分拣网络</button></div></div>

let scene='c2c',direction='forward',route='network',branch='normal',focus='pickup';

function returnStages(){return route==='direct'&&scene!=='c2b'?[RETURN_NETWORK.direct,RETURN_NETWORK.dropoff]:[RETURN_NETWORK.intake,RETURN_NETWORK.sort,RETURN_NETWORK.linehaul,RETURN_NETWORK.relay,RETURN_NETWORK.destination,RETURN_NETWORK.dropoff]}
function exceptionReceipt(){
  const personal=scene==='c2c'||scene==='c2b';
  return {...REVERSE.find(stage=>stage.id==='r-receive'),by:null,
    actor:personal?'原个人寄件人或指定接收方':'原企业发货方或指定接收方',
    steps:[personal?'原寄件人／指定接收方接货':'原发货企业／指定接收点接货','核对退回货物与数量','确认收货并登记差异']};
}
function currentStages(){
  let list=direction==='reverse'?(SERVICE_STAGES[branch]||REVERSE):FORWARD;
  if(direction==='reverse'){list=[...list.slice(0,3),...returnStages(),...list.slice(3)];if(scene==='c2c')list=list.filter(s=>s.id!=='r-inspect');return list}
  if(scene==='b2b'&&route==='direct')list=list.filter(s=>!['origin','sort','hub','relay','desthub','destsort','station'].includes(s.id)).map(stage=>stage.id==='linehaul'?{...stage,title:'直达发运与在途',caption:'起点到约定接收地点',detail:'承运方完成装载后，从发货地点直接运至约定接收地点。本图以整车直达为例，途中跟踪发运、在途和到达状态。'}:stage);
  if(branch==='normal')return list;
  if(branch==='cancel')return [list[0],EXCEPTION_STAGES.cancelled];
  const before=id=>list.slice(0,list.findIndex(s=>s.id===id)+1);
  const throughTransit=before('linehaul');
  if(branch==='intercept')return [...throughTransit,EXCEPTION_STAGES.interceptRequest,EXCEPTION_STAGES.interceptExecute,...returnStages(),exceptionReceipt(),EXCEPTION_STAGES.returnClose];
  if(branch==='interceptFail')return [...throughTransit,EXCEPTION_STAGES.interceptRequest,EXCEPTION_STAGES.interceptFailed,...list.slice(list.findIndex(s=>s.id==='linehaul')+1)];
  if(branch==='reroute')return [...throughTransit,EXCEPTION_STAGES.interceptRequest,EXCEPTION_STAGES.interceptExecute,EXCEPTION_STAGES.replan,...list.slice(list.findIndex(s=>s.id==='linehaul')+1)];
  const beforeDelivery=list.slice(0,list.findIndex(s=>s.id==='delivery'));
  if(branch==='failed')return [...beforeDelivery,EXCEPTION_STAGES.attempt,EXCEPTION_STAGES.failedAttempt,EXCEPTION_STAGES.redelivery,list.find(s=>s.id==='close')];
  if(branch==='refuse')return [...beforeDelivery,EXCEPTION_STAGES.attempt,EXCEPTION_STAGES.refusal,...returnStages(),exceptionReceipt(),EXCEPTION_STAGES.returnClose];
  if(branch==='pickupPoint')return [...beforeDelivery,EXCEPTION_STAGES.pickupNotice,EXCEPTION_STAGES.pickupSign,list.find(s=>s.id==='close')];
  if(branch==='unclaimed')return [...beforeDelivery,EXCEPTION_STAGES.pickupNotice,EXCEPTION_STAGES.unclaimedReturn,...returnStages(),exceptionReceipt(),EXCEPTION_STAGES.returnClose];
  return list;
}
function steps(s){return s.by?.[scene]||s.steps}
function updateControls(){
  document.querySelectorAll('[data-scene]').forEach(el=>{const active=el.dataset.scene===scene;el.classList.toggle('active',active);el.setAttribute('aria-pressed',active)});
  $('returnBlock').classList.toggle('visible',scene==='c2b');
  document.querySelectorAll('[data-service]').forEach(el=>el.setAttribute('aria-pressed',el.dataset.service===branch));
  const returnPath=[...SERVICE_BRANCHES,'intercept','refuse','unclaimed'].includes(branch);
  const routeBlock=$('routeBlock'),targetGroup=scene==='c2c'||scene==='c2b'?$('personalGroup'):$('enterpriseGroup');
  if(routeBlock.parentElement!==targetGroup)targetGroup.appendChild(routeBlock);
  routeBlock.classList.toggle('visible',scene!=='c2b'&&(returnPath||scene==='b2b'));
  $('routeTitle').textContent=SERVICE_BRANCHES.includes(branch)?'运输组织':returnPath?'返运组织':'B2B 运输路径';
  document.querySelector('[data-route="direct"]').textContent=SERVICE_BRANCHES.includes(branch)?'直达运输':returnPath?'直达返运':'整车直达';
  document.querySelector('[data-route="network"]').textContent=returnPath?'网点／分拣网络':'零担网络';
  document.querySelectorAll('[data-route]').forEach(el=>{const active=el.dataset.route===route;el.classList.toggle('active',active);el.setAttribute('aria-pressed',active)});
  document.querySelectorAll('[data-branch]').forEach(el=>{const active=el.dataset.branch===branch;el.classList.toggle('active',active);el.setAttribute('aria-pressed',active)});
  const failOption=document.querySelector('[data-branch="interceptFail"]'),showFail=branch==='intercept'||branch==='interceptFail';
  failOption.classList.toggle('visible',showFail);$('interceptGroup').classList.toggle('expanded',showFail);failOption.setAttribute('aria-hidden',!showFail);failOption.tabIndex=showFail?0:-1;failOption.inert=!showFail;
  $('branchContext').textContent=BRANCHES[branch].hint+(returnPath?' '+(scene!=='c2b'&&route==='direct'?'图示为直达返运。':'图示为跨区域网络路径，设施可合并或省略。'):'');
}

<section class="guide-section"><h3>先用一票货理解主线</h3><p>先选 C2C 的常规交付，想象“给朋友寄一件物品”：提交寄件需求，准备包装，交给承运方，经网络处理和运输，最后交给朋友。沿卡片依次问：<b>货物在哪里？谁接手？有什么记录证明？</b></p><p>卡片展示作业顺序；点击卡片后，下方解释目的、参与方、结果和易混点。箭头表示这一示例的先后衔接，实际设施可合并或省略。</p></section>
<section class="guide-section"><h3>再比较四种发收关系</h3><p>C 表示个人，B 表示企业；C2C、C2B、B2C、B2B 在这里按本次发运的“发货方 → 收货方”划分。例如，商家发货给消费者是 B2C，消费者寄回商家是另一程 C2B。平台代下单不改变实物发收双方。</p><p>C2B 可选退货单、回收单或维修单；再次点击所选单据回到普通寄件。<b>退货关注交易处理，回收关注价值与去向，维修关注故障与返还。</b>三者可以共用取件和运输作业，企业收货后的处理目的不同。</p></section>
<section class="guide-section"><h3>把业务记录和实物状态分开</h3><ul><li><b>业务单：</b>记录交易、退货、回收或维修需求；建立业务单尚不能证明已交运。</li><li><b>物流委托与运单：</b>记录运输要求及跟踪信息；有运单号后，还要查看受理和揽收状态。</li><li><b>揽收与发运：</b>揽收是承运方接货，干线发运是该运输段实际出发；中间可能还有集货和分拣。</li><li><b>交付与企业处理：</b>承运方交付之后，企业可能另行收货核对、检验、退款或维修。付款也可能预付、后结或与实物作业并行。</li></ul></section>
<section class="guide-section"><h3>最后看异常发生在哪里</h3><p>揽收前取消无需返运；在途拦截需核验并确认执行结果；未妥投后可能再投或转自提；拒收和超期未取按规则确认是否退回。上方每个情境展示一条路径，请分别阅读。</p><p>异常退回时，左侧场景仍标识原发运关系，回程按退回指令送至指定接收方；地址未必是原寄件地址。维修后寄给个人则是另一次 B2C 发运。</p><p class="guide-note"><b>练习：</b>“有运单号但未交件”应看委托状态；“已签收但尚未退款”应看企业业务处理；“已申请拦截”应继续查执行结果。</p></section>
<section class="guide-section"><h3>设施名称与适用范围</h3><p>网点侧重接入与集货，分拣／分拨侧重按去向分流，枢纽侧重线路衔接与运力组织。企业可能合设这些设施；同名设施也可能承担不同作业，应结合实际功能理解。</p><p>B2B 可比较整车直达与零担网络这两种示例。整车／零担描述货量与运力组织，直达／网络描述路径，两者并非同一分类维度。C2B 在本图只展示网点／分拣网络示例。这样展示不表示 C2B 在实际业务中只能走网络路径。</p><p>本图面向一般国内寄递和货运学习，未展开跨境清关、危险品等专项流程。GS1 提供企业间交接模型，UPU 提供邮政网络作业示例，ASCM SCOR 提供流程框架；本图把这些边界归纳到个人与企业场景。承运商和品牌服务规则仅作实例，具体期限、费用和适用条件以所选服务为准。</p></section>`;
let previousFocus=null;function openModal(kind){previousFocus=document.activeElement;if(kind==='refs'){$('modalTitle').textContent='参考文档';$('modalBody').innerHTML='<p>流程框架用于理解作业边界，具体服务规则用于举例。GS1 原文以企业间业务为范围；本图对个人场景的应用属于教学归纳。UPS、FedEx、USPS 和 Apple 的示例不代表所有企业的统一规则。</p>'+SOURCES.map(([name,desc,url])=>`<div class="reference"><strong><a href="${url}" target="_blank" rel="noopener noreferrer">${ESC(name)} ↗</a></strong><span>${ESC(desc)}</span></div>`).join('')}else{$('modalTitle').textContent='读图说明';$('modalBody').innerHTML=GUIDE_HTML}$('modalLayer').classList.add('open');$('modalLayer').setAttribute('aria-hidden','false');$('closeModal').focus()}
function closeModal(){$('modalLayer').classList.remove('open');$('modalLayer').setAttribute('aria-hidden','true');previousFocus?.focus()}
$('guideBtn').onclick=()=>openModal('guide');$('refsBtn').onclick=()=>openModal('refs');$('closeModal').onclick=closeModal;$('modalLayer').addEventListener('click',e=>{if(e.target===$('modalLayer'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalLayer').classList.contains('open')){closeModal();return}if($('modalLayer').classList.contains('open')||e.target.matches('input,textarea,select,[contenteditable="true"]'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();stepNode(e.key==='ArrowRight'?1:-1)}});render();
